<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head_padrão('Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu_superior('users')}"></nav>
    <h1>Welcome To Users Page</h1>
    <table th:unless="${users.isEmpty}">
        <thead>
            <tr>
                <th>Admin</th>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}" th:object="${user}">
                <td th:text="*{admin}">Admin</td>
                <td th:text="*{firstName}">First Name</td>
                <td th:text="*{lastName}">Last Name</td>
            </tr>
        </tbody>

    </table>
    <a href="/users/create">
        <button>Create New User</button>
    </a>
</body>
</html>
